  <rect width="256" height="256" rx="38" fill="url(#bg)"/>
  <g fill="url(#ink)" text-anchor="middle" font-family="Bodoni 72, Didot, 'Times New Roman', serif" font-weight="700">
    <text x="111" y="169" font-size="157">S</text>
    <text x="160" y="174" font-size="139">M</text>
